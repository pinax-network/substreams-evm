specVersion: v0.1.0
package:
  name: evm_balances_storage
  version: v0.1.0
  url: https://github.com/pinax-network/substreams-evm
  description: Experimental BSC native BNB and WBNB balances from Extended state changes, without RPC.
imports:
  database: ../spkg/substreams-database-change-v2.0.0.spkg
protobuf:
  files: [balances.proto]
  importPaths: ["."]
binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/evm_balances_storage.wasm
modules:
  - name: map_balances
    kind: map
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:evm.balances.storage.v1.BlockBalances
  - name: db_out
    kind: map
    inputs:
      - map: map_balances
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges
  - name: map_erc20_candidates
    kind: map
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:evm.balances.storage.v1.StorageCandidates
network: bsc
