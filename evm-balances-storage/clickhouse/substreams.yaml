specVersion: v0.1.0
package:
  name: evm_clickhouse_balances_storage
  version: v0.1.0
  url: https://github.com/pinax-network/substreams-evm
  description: Experimental BSC storage balances, with history for isolated comparison.
imports:
  db: ../../spkg/evm-balances-storage-v0.1.0.spkg
modules:
  - name: db_out
    use: db:db_out
sink:
  module: db_out
  type: sf.substreams.sink.sql.v1.Service
  config:
    schema: ./schema.comparison.sql
    engine: clickhouse
network: bsc
