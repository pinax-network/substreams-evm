specVersion: v0.1.0
package:
  name: evm_dex_foundational_store
  version: v0.7.0
  url: https://github.com/pinax-network/substreams-evm
  description: |
    Compatibility entrypoint for the unified EVM pool package. map_entries
    aliases map_pool_entries and retains the Hosted Store key/value contract.
  image: ../image.png

imports:
  pools: ../spkg/dex-swaps-pools-v0.9.0.spkg

modules:
  - name: map_entries
    use: pools:map_pool_entries
  - name: map_pool_entries
    use: pools:map_pool_entries

network: mainnet
