specVersion: v0.1.0
package:
  name: dex_pool_state
  version: v0.1.0
  url: https://github.com/pinax-network/substreams-evm
  description: Complete-block Uniswap V2 reserves and ordered V3 pool changes
  image: ../image.png

imports:
  v2: ../dex/uniswap-v2/substreams.yaml
  v3: ../dex/uniswap-v3/substreams.yaml

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/dex_pool_state.wasm

protobuf:
  files:
    - dex-pool-state.proto
  importPaths:
    - ../proto/v1
    - ../proto/v1/dex

modules:
  - name: map_pool_state
    kind: map
    inputs:
      - map: v2:map_pool_closes
      - map: v3:map_pool_changes
    output:
      type: proto:dex.pool_state.v1.BlockPoolState

network: mainnet
