[package]
name = "erc20-balances-storage-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Native Rust comparison, RPC audit and ERC-20 discovery tools"

# Host tools are intentionally empty on WASM; the workspace also checks every
# member for wasm32-unknown-unknown. None of these dependencies enter ingestion.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
primitive-types = { version = "0.11", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
erc20-balances-storage = { path = ".." }
prost = { workspace = true }
substreams-ethereum = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
substreams-abis = { workspace = true }
